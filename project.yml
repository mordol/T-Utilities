name: T-Utilities
options:
  bundleIdPrefix: com.taegyu
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64

packages:
  TUCore:
    path: Packages/TUCore
  TUUI:
    path: Packages/TUUI
  ModClipboard:
    path: Packages/ModClipboard
  ModClock:
    path: Packages/ModClock
  ModAwake:
    path: Packages/ModAwake
  ModWindows:
    path: Packages/ModWindows
  ModCable:
    path: Packages/ModCable
  ModDictionary:
    path: Packages/ModDictionary
  ModMouse:
    path: Packages/ModMouse
  ModStats:
    path: Packages/ModStats
  ModSwitcher:
    path: Packages/ModSwitcher

targets:
  T-Utilities:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources/Assets.xcassets
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: TUCore
      - package: TUUI
      - package: ModClipboard
      - package: ModClock
      - package: ModAwake
      - package: ModWindows
      - package: ModCable
      - package: ModMouse
      - package: ModDictionary
      - package: ModStats
      - package: ModSwitcher
      - target: AwakeGuard
        embed: true
        codeSign: true
        copy:
          destination: executables
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: T-Utilities
        CFBundleShortVersionString: "0.1.12"
        CFBundleVersion: "13"
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "© 2026 Taegyu"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taegyu.tutilities
        PRODUCT_NAME: T-Utilities
        # Stable self-signed identity so TCC grants (Accessibility…) survive rebuilds.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "T-Utilities Dev"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []

  AwakeGuard:
    type: tool
    platform: macOS
    sources:
      - App/AwakeGuard
    dependencies:
      - package: ModAwake
        product: ClamshellKit
    settings:
      base:
        PRODUCT_NAME: AwakeGuard
        PRODUCT_BUNDLE_IDENTIFIER: com.taegyu.tutilities.awakeguard
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "T-Utilities Dev"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
